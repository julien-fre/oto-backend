# Alembic — l'outil de migration. Voir `docs/migrations-versionnees.md`.
#
# Ce fichier ne porte AUCUN DSN : la connexion vient de `DATABASE_URL`, lue par
# `env.py`, exactement comme le pool de l'application. Une seule source, jamais deux.
[alembic]
script_location = oto_mcp/db/migrations
prepend_sys_path = .
path_separator = os
# Le nom d'un fichier de migration porte sa date : on lit une file dans l'ordre
# sans ouvrir les fichiers.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
