version: 2
updates:
  # Actions GitHub (deploy.yml) — peu de bruit, corrige les dépréciations runner.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Dépendances Python (pyproject.toml). oto-core est une dép git pinnée sur tag
  # (ADR 0020) → Dependabot ne la touche pas (géré à la main). Groupé = 1 PR/semaine.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # Le plafond de fastmcp (pyproject.toml) est délibéré : une montée hors de
      # `<3.5` a déjà fait disparaître `fastmcp.tools.tool` en amont, cassant un
      # middleware qui l'importe (PR #950, 15/09/2026). Monter le plafond est un
      # acte volontaire — l'essayer, lancer la suite, corriger, border plus haut —
      # pas une proposition automatique. Les patchs `3.4.x` restent bienvenus.
      - dependency-name: "fastmcp"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
