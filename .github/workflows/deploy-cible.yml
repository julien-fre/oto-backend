name: Deploy cible

# Monter une INSTANCE CIBLE à un tag du tronc (#967, ADR 0070 — docs/instance-cible.md).
#
# Une cible ne bouge que quand quelqu'un DÉCIDE de la monter de version : ce workflow ne
# part qu'à la main, avec un tag choisi. Son déclencheur vit dans le dépôt PRIVÉ du
# propriétaire de la cible, qui l'appelle (`workflow_call`, épinglé sur un tag ou un SHA
# de ce dépôt) ; `workflow_dispatch` reste pour une cible dont l'environnement est ici.
# Rien, dans ce dépôt, ne l'appelle. Il ne consulte que la cible elle-même : sa
# déclaration, sa préprod, sa prod, et le tronc (le tag doit être sur la branche
# principale). Aucun autre déploiement n'entre en compte.
#
# Appelé, `github.repository`, `github.token` et `environment:` sont ceux du dépôt
# APPELANT : c'est son environnement qui est vérifié puis approuvé, ses secrets
# d'environnement qui sont lus. Le code déployé, lui, vient toujours du TRONC (`TRONC`,
# au tag demandé), jamais du dépôt appelant.
#
# Chaque cible est un ENVIRONNEMENT GitHub (le nom est l'entrée `cible`) qui porte tout
# ce qui la distingue : sa déclaration (`CIBLE_DECLARATION`, JSON validé contre
# l'inventaire du tag), son accès (hôte, clé d'hôte épinglée, clé de déploiement, et en
# accès tunnel le jeton de service Cloudflare Access) et, s'il existe, le consommateur de
# son API. Cet environnement EXIGE une approbation (un relecteur requis) : le workflow le
# vérifie et refuse de partir sinon — ou, dans un dépôt privé sans relecteurs requis
# (offre sans Enterprise), la liste de ceux qui peuvent la lancer (`CIBLE_DECLENCHEURS`) :
# lancer vaut alors décider. Ce dépôt est public : il ne nomme aucune cible, il n'en porte
# que la forme (`deploy/cible/declaration.gabarit.json`).
#
# L'ordre : entrées validées et environnement protégé → (approbation) → tag sur la
# branche principale → déclaration jugée par l'inventaire du tag → contrat d'API du tag
# confronté au consommateur de la cible (contrôle INVERSE, facultatif : c'est la cible
# qui juge le tag) → préprod de la cible → prod de la cible, qui exige que sa préprod
# SERVE déjà ce tag. Un seul job derrière l'approbation : une montée, une décision.
#
# Runner hébergé par GitHub : la clé de déploiement n'ouvre qu'une commande forcée
# (`deploy/cible/porte.sh`). Le chemin jusqu'à la machine est l'entrée `acces`, choisie
# explicitement, sans défaut : `tunnel` (Cloudflare Access, jeton de service) ou `ssh`
# (le `:22` de la machine, en attendant son tunnel) — hôte épinglé dans les deux cas.
#
# Ce dépôt est public, ses journaux d'Actions aussi : ils ne montrent JAMAIS ce qui
# désigne la cible — hôte, domaine, nom d'instance, slug, ni aucune valeur de sa
# déclaration (#967, D5). Tout ce qui la désigne est donc un SECRET de son environnement,
# jamais une variable (`vars.`) ni une entrée : GitHub imprime l'`env:` de chaque step en
# tête de son journal, et ne masque d'office que les secrets. Ce qu'on en DÉRIVE (un
# hôte tiré de la déclaration, ses URL, son domaine) ne l'est pas : chaque job commence
# par le masquer (`::add-mask::`), avant tout autre geste, et les messages parlent de
# « la cible », de « sa préprod », jamais de son nom. Seul le nom de l'environnement
# (l'entrée `cible`) est public par nature : il est choisi neutre, et masqué aussi.
on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Environnement GitHub de la cible (il porte sa déclaration)"
        required: true
      tag:
        description: "Tag du tronc à monter (vX.Y.Z)"
        required: true
      etape:
        description: "preprod, prod (exige la préprod déjà à ce tag), ou les deux à la suite"
        type: choice
        options: [preprod, prod, preprod-puis-prod]
        default: preprod
      action:
        description: "deployer le tag, ou retour à la couleur précédente"
        type: choice
        options: [deployer, retour]
        default: deployer
      acces:
        description: "Chemin jusqu'à la machine : tunnel (Cloudflare Access) ou ssh (son :22, en attendant le tunnel)"
        type: choice
        options: [tunnel, ssh]
        required: true
  # Le déclencheur du dépôt du propriétaire de la cible. Mêmes entrées, en chaînes :
  # `workflow_call` n'a pas de `choice`, le job `entrees` les valide donc toutes.
  # Les secrets sont ceux de l'ENVIRONNEMENT de la cible dans le dépôt appelant, lus par
  # le job qui le nomme (GitHub ne transmet pas un secret d'environnement par l'appel) :
  # tous facultatifs ici, chacun exigé en le nommant par le script qui s'en sert.
  workflow_call:
    inputs:
      cible:
        description: "Environnement GitHub de la cible, dans le dépôt appelant"
        type: string
        required: true
      tag:
        description: "Tag du tronc à monter (vX.Y.Z)"
        type: string
        required: true
      etape:
        description: "preprod, prod (exige la préprod déjà à ce tag), ou preprod-puis-prod"
        type: string
        default: preprod
      action:
        description: "deployer, ou retour à la couleur précédente"
        type: string
        default: deployer
      acces:
        description: "tunnel (Cloudflare Access) ou ssh (le :22 de la machine) — sans défaut"
        type: string
        required: true
    secrets:
      CIBLE_DECLARATION:
        description: "Déclaration de la cible (JSON, une ligne)"
        required: false
      CIBLE_CONSOMMATEUR:
        description: "Consommateur de son API (JSON, une ligne), facultatif"
        required: false
      CIBLE_SSH_HOTE:
        description: "Hôte SSH : l'application Access (tunnel) ou la machine (ssh)"
        required: false
      CIBLE_SSH_UTILISATEUR:
        description: "Utilisateur de déploiement"
        required: false
      CIBLE_SSH_KNOWN_HOSTS:
        description: "Clé d'hôte épinglée, sous le nom de l'hôte SSH"
        required: false
      CIBLE_SSH_CLE:
        description: "Clé privée de déploiement (commande forcée vers la porte)"
        required: false
      CIBLE_CF_ACCESS_CLIENT_ID:
        description: "Jeton de service Access, identifiant (accès tunnel)"
        required: false
      CIBLE_CF_ACCESS_CLIENT_SECRET:
        description: "Jeton de service Access, secret (accès tunnel)"
        required: false
      CIBLE_CONSOMMATEUR_CLE:
        description: "Clé de lecture seule du dépôt du consommateur, si cle"
        required: false
      CIBLE_DECLENCHEURS:
        description: "Logins GitHub autorisés à lancer une montée, si l'environnement n'exige aucun relecteur"
        required: false

permissions:
  contents: read

# Une montée de version à la fois PAR CIBLE ; deux cibles ne s'attendent pas.
concurrency:
  group: deploy-cible-${{ inputs.cible }}
  cancel-in-progress: false

env:
  # Le dépôt dont vient TOUT le code exécuté, quel que soit le dépôt qui appelle.
  TRONC: otomata-tech/oto-backend
  CIBLE: ${{ inputs.cible }}
  TAG: ${{ inputs.tag }}
  ETAPE: ${{ inputs.etape }}
  ACTION: ${{ inputs.action }}
  ACCES: ${{ inputs.acces }}

jobs:
  # Les entrées atterrissent dans un `ref:`, un nom d'environnement et des commandes :
  # validées AVANT tout usage, et jamais interpolées dans un script (passées par `env`).
  # Puis l'environnement de la cible doit EXISTER et être protégé : un environnement
  # absent serait créé à la volée par GitHub, sans protection. Il exige un relecteur, ou
  # — ses déploiements limités à des branches — la liste de ses déclencheurs, vérifiée
  # par le premier contrôle du job `monter` (seul un job qui nomme l'environnement en lit
  # les secrets ; `protection.sh`). Appelé,
  # c'est l'environnement du dépôt appelant, lu par SON jeton (`actions: read`, que le
  # job appelant doit accorder : un appelé ne peut qu'abaisser ses permissions).
  entrees:
    name: Entrées et protection de la cible
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      protection: ${{ steps.protection.outputs.protection }}
    steps:
      # Avant tout geste : le nom de la cible ne s'affiche plus (chaque ligne, une entrée
      # peut en porter plusieurs), ni le dépôt appelant qui désigne son propriétaire.
      - name: Masquer la cible
        env:
          APPELANT: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS= read -r ligne; do
            if [ -n "$ligne" ]; then printf '::add-mask::%s\n' "$ligne"; fi
          done <<< "$CIBLE"
          if [ "$APPELANT" != "$TRONC" ]; then
            printf '::add-mask::%s\n' "$APPELANT" "${APPELANT%%/*}" "${APPELANT#*/}"
          fi
      - name: Valider les entrées
        run: |
          set -euo pipefail
          [[ "$CIBLE" =~ ^[a-z][a-z0-9-]{1,38}$ ]] || { echo "::error::cible invalide (attendu ^[a-z][a-z0-9-]{1,38}$)"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag invalide (vX.Y.Z) : « $TAG »"; exit 1; }
          case "$ETAPE" in preprod|prod|preprod-puis-prod) ;; *) echo "::error::etape invalide (preprod | prod | preprod-puis-prod) : « $ETAPE »"; exit 1 ;; esac
          case "$ACTION" in deployer|retour) ;; *) echo "::error::action invalide (deployer | retour) : « $ACTION »"; exit 1 ;; esac
          case "$ACCES" in tunnel|ssh) ;; *) echo "::error::acces invalide ou absent (tunnel | ssh, sans défaut) : « $ACCES »"; exit 1 ;; esac
          echo "### $ACTION $TAG → la cible ($ETAPE, accès $ACCES)" >> "$GITHUB_STEP_SUMMARY"
      - name: L'environnement de la cible est protégé
        id: protection
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$TAG" --filter=blob:none --sparse "https://github.com/${TRONC}.git" tronc
          git -C tronc sparse-checkout set deploy/cible
          tronc/deploy/cible/protection.sh environnement "$DEPOT" "$CIBLE"

  # UN job derrière l'approbation : la décision couvre toute la montée demandée.
  monter:
    name: Monter la cible
    needs: [entrees]
    runs-on: ubuntu-latest
    environment: ${{ inputs.cible }}
    # amorce + installation + démarrage (~40 s) + bascule, par rôle ; marge pour une naissance.
    timeout-minutes: 60
    env:
      CIBLE_DECLARATION: ${{ secrets.CIBLE_DECLARATION }}
      CONSOMMATEUR: ${{ secrets.CIBLE_CONSOMMATEUR }}
      CIBLE_SSH_HOTE: ${{ secrets.CIBLE_SSH_HOTE }}
      CIBLE_SSH_UTILISATEUR: ${{ secrets.CIBLE_SSH_UTILISATEUR }}
      CIBLE_SSH_KNOWN_HOSTS: ${{ secrets.CIBLE_SSH_KNOWN_HOSTS }}
      CIBLE_DECLENCHEURS: ${{ secrets.CIBLE_DECLENCHEURS }}
    steps:
      # ── MASQUAGE, AVANT TOUT GESTE (D5) ─────────────────────────────────────────────
      # Tout ce que révèlent les secrets de la cible : chaque ligne brute de chacun, et
      # ce qu'on en tire ou en dérive — instance, projet, hôtes publics et leurs URL (dont
      # `/api/version`), valeurs du `.env` de chaque rôle (domaines, slug, marque, bucket,
      # adresses), chaque domaine qui y paraît avec ses domaines parents et son libellé,
      # l'hôte et l'utilisateur SSH, les hôtes épinglés, le consommateur et son dépôt,
      # chaque login de la liste des déclencheurs. Un
      # masque couvre toute chaîne qui le contient : l'instance masque ses chemins, unités
      # et utilisateur de service ; l'hôte, ses URL. Restent lisibles les rôles (preprod,
      # prod), les booléens et les petits nombres (ports), qui ne désignent personne.
      # Une déclaration illisible n'a que ses lignes brutes masquées — `declaration.py
      # verifier` la refuse plus bas. Avant le checkout : rien du dépôt n'y sert.
      - name: Masquer les valeurs de la cible
        run: |
          set -euo pipefail
          # jq se tait (un message d'erreur citerait la valeur) : un échec arrête tout ici.
          masques=$(jq -nr --arg cible "$CIBLE" --arg decl "$CIBLE_DECLARATION" \
              --arg conso "$CONSOMMATEUR" --arg hote "$CIBLE_SSH_HOTE" \
              --arg utilisateur "$CIBLE_SSH_UTILISATEUR" --arg hotes "$CIBLE_SSH_KNOWN_HOSTS" \
              --arg declencheurs "$CIBLE_DECLENCHEURS" '
            def bords: gsub("^[[:space:]]+|[[:space:]]+$"; "");
            def lignes: split("\n")[] | bords | select(length > 0);
            def domaines: scan("(?:[A-Za-z0-9-]+\\.)+[A-Za-z]{2,63}")
              | ., (split(".") as $l | (range(1; ($l | length) - 1) as $i | $l[$i:] | join(".")),
                                       ($l[-2] | select(length >= 3)));
            def jetons: ., domaines, scan("[^[:space:]<>\",;]+@[^[:space:]<>\",;]+"),
                        (split(",")[] | bords);
            def lu: try fromjson catch null;
            ($decl | lu) as $d | ($conso | lu) as $c
            | [ ($cible, $decl, $conso, $hote, $utilisateur, $hotes, $declencheurs | lignes),
                ($declencheurs | splits("[,[:space:]]+")),
                ($c | objects | .nom, .depot, (.depot | strings | split("/")[0]), .chemin),
                ( ($hote | lignes),
                  ($hotes | lignes | split(" ")[0] | split(",")[]
                     | sub("^\\[(?<h>[^]]+)\\]:[0-9]+$"; "\(.h)")),
                  ($d | objects | .instance, (.secrets | objects | .projet),
                     (.roles | objects | .[] | objects
                      | (.hote_public | strings | ., "https://\(.)", "https://\(.)/api/version"),
                        (.env | objects | to_entries[] | select(.key != "OTO_ENV") | .value)))
                  | strings | jetons) ]
            | map(strings | lignes)
            | map(select((test("[[:alpha:]]") or length >= 8)
                  and (IN("true", "false", "null", "preprod", "prod") | not)))
            | unique[]' 2>/dev/null) \
            || { echo "::error title=Masquage impossible::les valeurs de la cible n'ont pas pu être masquées — rien n'est monté."; exit 1; }
          while IFS= read -r masque; do
            if [ -n "$masque" ]; then printf '::add-mask::%s\n' "$masque"; fi
          done <<< "$masques"

      # Le TRONC au tag, jamais le dépôt appelant ; son jeton n'y reste pas.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TRONC }}
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # Premier contrôle : la montée a été DÉCIDÉE — approuvée par un relecteur requis, ou
      # lancée par un déclencheur de la liste de l'environnement. `triggering_actor`, pas
      # `actor` : relancer un run garde l'`actor` d'origine, mais c'est celui qui relance
      # qui décide ; avec `actor`, n'importe qui pourrait relancer la montée d'un autre.
      - name: La montée est décidée
        env:
          PROTECTION: ${{ needs.entrees.outputs.protection }}
          ACTEUR: ${{ github.triggering_actor }}
        run: deploy/cible/protection.sh declencheurs

      # La porte le revérifie sur la machine ; ici, on refuse avant d'avoir rien touché.
      - name: Le tag est sur la branche principale du tronc
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "refs/tags/$TAG" FETCH_HEAD \
            || { echo "::error title=Tag hors du tronc::$TAG n'est pas sur la branche principale — rien n'est monté."; exit 1; }

      - name: Déclaration de la cible, jugée par l'inventaire du tag
        run: |
          set -euo pipefail
          printf '%s' "$CIBLE_DECLARATION" > "$RUNNER_TEMP/declaration.json"
          python3 deploy/cible/declaration.py verifier "$RUNNER_TEMP/declaration.json"

      # ── CONTRÔLE INVERSE DE COMPATIBILITÉ (facultatif) ──────────────────────────────
      # C'est la cible qui juge le tag : le contrat d'API que CE tag servirait chez elle
      # (dérivé par import, sans serveur) est confronté au contrat qu'épingle le
      # consommateur qu'elle déclare (`CIBLE_CONSOMMATEUR`, JSON {nom, depot, chemin,
      # cle: bool}). Seule une rupture d'appel ou de lecture bloque
      # (`scripts/contrat-front.py`) ; un contrat illisible bloque aussi : on ne monte
      # pas sans verdict. Sans consommateur déclaré, le job le DIT et ne juge rien.
      # La logique vit dans `scripts/contrat-cible.sh` — sa source unique (#1195), que le
      # propriétaire de la cible lance aussi SEUL, pour un tag, sans rien monter
      # (`contrat-cible.yml`) : même verdict ici et là.
      - name: Un consommateur est-il déclaré ?
        id: declare
        run: |
          set -euo pipefail
          if [ "$ACTION" = retour ]; then
            echo "Retour arrière : aucune version nouvelle, rien à confronter." >> "$GITHUB_STEP_SUMMARY"
            echo "juger=non" >> "$GITHUB_OUTPUT"; exit 0
          fi
          scripts/contrat-cible.sh consommateur

      # Le contrat se dérive du jeu que la cible installera : celui du verrou du tag
      # (oto-backend#932), comme `bg_install` sur la machine — le script l'a exigé.
      - name: Install (dépendances de runtime, par le verrou)
        if: steps.declare.outputs.juger == 'oui'
        uses: ./.github/actions/installer-par-le-verrou
        with:
          python-version: "3.12"

      # Dériver le contrat du tag (facturation selon la déclaration), lire le contrat
      # épinglé, confronter ; la clé de lecture est effacée en sortant, quelle que soit
      # l'issue.
      - name: Confronter le contrat du tag au consommateur
        if: steps.declare.outputs.juger == 'oui'
        env:
          CLE_LECTURE: ${{ secrets.CIBLE_CONSOMMATEUR_CLE }}
          NOM: ${{ steps.declare.outputs.nom }}
          DEPOT: ${{ steps.declare.outputs.depot }}
          CHEMIN: ${{ steps.declare.outputs.chemin }}
          SECRET: ${{ steps.declare.outputs.secret }}
        run: scripts/contrat-cible.sh juger "$RUNNER_TEMP/declaration.json"

      # ── PRÉPROD, PUIS PROD ──────────────────────────────────────────────────────────
      # `appeler.sh` suit l'accès choisi (`ACCES`) : en `tunnel`, il exige le jeton
      # Access et refuse sans ; en `ssh`, il n'installe ni n'utilise `cloudflared`.
      - name: Monter la préprod
        if: inputs.etape != 'prod'
        env:
          CIBLE_SSH_CLE: ${{ secrets.CIBLE_SSH_CLE }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CIBLE_CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CIBLE_CF_ACCESS_CLIENT_SECRET }}
        run: deploy/cible/appeler.sh "$ACTION" preprod "$TAG"

      # La prod ne monte que sur un tag que la préprod de la CIBLE sert déjà — constaté
      # sur ce qu'elle annonce (`/api/version`), pas sur un run passé.
      - name: La préprod sert le tag
        if: inputs.action == 'deployer'
        run: deploy/cible/constater.sh "$RUNNER_TEMP/declaration.json" preprod "$TAG"

      - name: Monter la prod
        if: inputs.etape != 'preprod'
        env:
          CIBLE_SSH_CLE: ${{ secrets.CIBLE_SSH_CLE }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CIBLE_CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CIBLE_CF_ACCESS_CLIENT_SECRET }}
        run: deploy/cible/appeler.sh "$ACTION" prod "$TAG"

      - name: La prod sert le tag
        if: inputs.action == 'deployer' && inputs.etape != 'preprod'
        run: deploy/cible/constater.sh "$RUNNER_TEMP/declaration.json" prod "$TAG"
